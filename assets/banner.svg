<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Matteo Gaudioso — Embedded software and applied machine learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#04060A"/>
      <stop offset="55%"  stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#12171F"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="112%" r="62%">
      <stop offset="0%"   stop-color="#FF6B35" stop-opacity="0.50"/>
      <stop offset="45%"  stop-color="#FF6B35" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#FF6B35" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#FFD08A" stop-opacity="1"/>
      <stop offset="78%"  stop-color="#FF6B35" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FF6B35" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300" rx="14"/></clipPath>

    <path id="track" d="M-60 300 Q600 176 1260 300"/>

    <style>
      .name { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; letter-spacing:11px; }
      .mono { font-family:"SFMono-Regular","JetBrains Mono",Consolas,monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#sky)"/>

    <g stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1">
      <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200"/>
      <path d="M75 0V300M225 0V300M375 0V300M525 0V300M675 0V300M825 0V300M975 0V300M1125 0V300"/>
    </g>

    <g fill="#FFFFFF">
      <circle cx="96"   cy="46"  r="1.4" opacity=".7"><animate attributeName="opacity" values=".7;.15;.7" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="238"  cy="88"  r="1"   opacity=".4"><animate attributeName="opacity" values=".4;.9;.4"  dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="352"  cy="34"  r="1.5" opacity=".75"><animate attributeName="opacity" values=".75;.2;.75" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="486"  cy="66"  r="1"   opacity=".45"><animate attributeName="opacity" values=".45;.1;.45" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="712"  cy="30"  r="1.2" opacity=".6"><animate attributeName="opacity" values=".6;.95;.6" dur="4.7s" repeatCount="indefinite"/></circle>
      <circle cx="868"  cy="74"  r="1.5" opacity=".7"><animate attributeName="opacity" values=".7;.18;.7" dur="6.1s" repeatCount="indefinite"/></circle>
      <circle cx="1012" cy="42"  r="1"   opacity=".4"><animate attributeName="opacity" values=".4;.85;.4" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1128" cy="92"  r="1.3" opacity=".55"><animate attributeName="opacity" values=".55;.12;.55" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="150"  cy="128" r="1"   opacity=".3"><animate attributeName="opacity" values=".3;.7;.3" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="1062" cy="140" r="1"   opacity=".3"><animate attributeName="opacity" values=".3;.75;.3" dur="4.9s" repeatCount="indefinite"/></circle>
    </g>

    <rect y="150" width="1200" height="150" fill="url(#glow)"/>

    <path d="M-60 300 Q600 200 1260 300" fill="none" stroke="#FF6B35" stroke-opacity="0.16" stroke-width="1"/>
    <path d="M-60 300 Q600 188 1260 300" fill="none" stroke="url(#limb)" stroke-width="2"/>

    <g fill="#FF6B35" opacity="0.9">
      <path d="M0 0 L13 5 L0 10 L3.5 5 Z">
        <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
          <mpath href="#track"/>
        </animateMotion>
      </path>
    </g>

    <text class="name" x="594" y="132" text-anchor="middle" font-size="52" fill="#FFFFFF">MATTEO GAUDIOSO</text>

    <rect x="430" y="156" width="340" height="1.4" fill="url(#rule)"/>

    <text class="mono" x="598" y="188" text-anchor="middle" font-size="13.5" letter-spacing="4.5" fill="#FF6B35">EMBEDDED SOFTWARE · APPLIED MACHINE LEARNING</text>

    <text class="mono" x="598" y="216" text-anchor="middle" font-size="11" letter-spacing="3.5" fill="#8B949E">IPSA PARIS · 2ND YEAR · SOLDERING SINCE 8 · CODING SINCE 13</text>

    <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="14" fill="none" stroke="#FF6B35" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>
</svg>
