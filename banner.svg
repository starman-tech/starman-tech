<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Matteo Gaudioso — Embedded software and applied machine learning" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#05070B"/>
      <stop offset="60%"  stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="100%" r="70%">
      <stop offset="0%"   stop-color="#FF6B35" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#FF6B35" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#FF6B35" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#FFD08A" stop-opacity="1"/>
      <stop offset="75%"  stop-color="#FF6B35" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#FF6B35" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="14"/>
    </clipPath>

    <style>
      .name {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 10px;
      }
      .mono {
        font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
        letter-spacing: 4px;
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">

    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- faint technical grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
      <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200"/>
      <path d="M60 0V320M180 0V320M300 0V320M420 0V320M540 0V320M660 0V320M780 0V320M900 0V320M1020 0V320M1140 0V320"/>
    </g>

    <!-- starfield -->
    <g fill="#FFFFFF">
      <circle cx="88"  cy="52"  r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="212" cy="96"  r="1"   opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="336" cy="38"  r="1.6" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="455" cy="72"  r="1"   opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="602" cy="34"  r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.6;0.95;0.6" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="734" cy="88"  r="1.5" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="861" cy="46"  r="1"   opacity="0.45"><animate attributeName="opacity" values="0.45;0.85;0.45" dur="5.7s" repeatCount="indefinite"/></circle>
      <circle cx="978" cy="102" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="1096" cy="58" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="152" cy="132" r="0.9" opacity="0.35"/>
      <circle cx="522" cy="118" r="0.9" opacity="0.3"/>
      <circle cx="908" cy="136" r="0.9" opacity="0.35"/>
      <circle cx="1042" cy="26" r="0.8" opacity="0.4"/>
      <circle cx="266" cy="150" r="0.8" opacity="0.25"/>
      <circle cx="672" cy="152" r="0.8" opacity="0.25"/>
    </g>

    <!-- planet glow + limb -->
    <ellipse cx="600" cy="330" rx="720" ry="180" fill="url(#glow)"/>
    <path d="M-40 300 Q600 196 1240 300" fill="none" stroke="url(#limb)" stroke-width="2.5"/>
    <path d="M-40 312 Q600 212 1240 312" fill="none" stroke="url(#limb)" stroke-width="1" opacity="0.35"/>

    <!-- glider crossing the frame -->
    <g opacity="0.9">
      <path d="M0 0 L16 5 L0 10 L4 5 Z" fill="#FF6B35">
        <animateMotion path="M-40 210 Q400 150 780 176 T1260 132" dur="16s" repeatCount="indefinite" rotate="auto"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="16s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- identity -->
    <text class="name" x="600" y="150" text-anchor="middle" font-size="46" fill="#FFFFFF">MATTEO GAUDIOSO</text>

    <rect x="450" y="172" width="300" height="1.5" fill="url(#rule)"/>

    <!-- rotating taglines -->
    <g class="mono" font-size="13" text-anchor="middle" fill="#FF6B35">
      <text x="600" y="205" opacity="0">
        EMBEDDED SOFTWARE &#183; APPLIED MACHINE LEARNING
        <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" dur="13.5s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="205" opacity="0">
        SOLDERING SINCE 8 &#183; CODING SINCE 13
        <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" dur="13.5s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="205" opacity="0">
        STM32 &#183; PYTORCH &#183; KICAD &#183; FUSION 360
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="13.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- status line -->
    <g class="mono" font-size="11" fill="#8B949E" letter-spacing="2.5">
      <text x="600" y="248" text-anchor="middle">IPSA PARIS &#183; 2ND YEAR &#183; PARIS, FRANCE</text>
    </g>

    <rect x="0" y="0" width="1200" height="320" rx="14" fill="none" stroke="#30363D" stroke-width="1.5"/>
  </g>
</svg>
